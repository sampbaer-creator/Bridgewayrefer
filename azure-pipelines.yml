# BridgeWay Refer Azure DevOps deployment pipeline.
trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: bridgeway-azure
  resourceGroup: BridgeWay
  acrName: bridgewayacr3560
  apiApp: bridgeway-api
  webApp: bridgeway-web
  publicOrigin: https://bridgewayrefer.com
  apiImage: bridgeway-api
  webImage: bridgeway-web

stages:
- stage: Validate
  jobs:
  - job: TestsAndBuildChecks
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
    - task: UseDotNet@2
      inputs:
        packageType: sdk
        version: 10.0.x
    - task: DotNetCoreCLI@2
      displayName: Run API tests
      inputs:
        command: test
        projects: tests/BridgeWay.Api.Tests/BridgeWay.Api.Tests.csproj
        arguments: --configuration Release
        publishTestResults: true
    - task: NodeTool@0
      inputs:
        versionSpec: 24.x
    - bash: |
        set -euo pipefail
        npm ci --prefix src/bridgeway-web
        npm run build --prefix src/bridgeway-web
      displayName: Build frontend

- stage: BuildAndPush
  dependsOn: Validate
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - job: BuildPush
    steps:
    - checkout: self
      clean: true
      fetchDepth: 0
    - task: AzureCLI@2
      displayName: Build and push images
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          ACR_LOGIN_SERVER=$(az acr show --name $(acrName) --resource-group $(resourceGroup) --query loginServer --output tsv)
          az acr login --name $(acrName)
          COMMIT=$(Build.SourceVersion)
          BUILD_TAG=$(Build.BuildId)
          docker build --file src/BridgeWay.Api/Dockerfile --tag $ACR_LOGIN_SERVER/$(apiImage):$COMMIT --tag $ACR_LOGIN_SERVER/$(apiImage):$BUILD_TAG .
          docker build --file src/bridgeway-web/Dockerfile --build-arg BRIDGEWAYREFER_API_ORIGIN=$(publicOrigin) --build-arg BRIDGEWAY_API_ORIGIN=http://$(apiApp) --tag $ACR_LOGIN_SERVER/$(webImage):$COMMIT --tag $ACR_LOGIN_SERVER/$(webImage):$BUILD_TAG .
          docker push $ACR_LOGIN_SERVER/$(apiImage):$COMMIT
          docker push $ACR_LOGIN_SERVER/$(apiImage):$BUILD_TAG
          docker push $ACR_LOGIN_SERVER/$(webImage):$COMMIT
          docker push $ACR_LOGIN_SERVER/$(webImage):$BUILD_TAG
          echo "##vso[task.setvariable variable=acrLoginServer;isOutput=true]$ACR_LOGIN_SERVER"
          echo "##vso[task.setvariable variable=commit;isOutput=true]$COMMIT"
      name: imageMetadata

- stage: Deploy
  dependsOn: BuildAndPush
  lockBehavior: sequential
  variables:
    acrLoginServer: $[ stageDependencies.BuildAndPush.BuildPush.outputs['imageMetadata.acrLoginServer'] ]
    commit: $[ stageDependencies.BuildAndPush.BuildPush.outputs['imageMetadata.commit'] ]
  jobs:
  - deployment: Production
    environment: BridgeWay-production
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            clean: true
            fetchDepth: 0
          - task: AzureCLI@2
            displayName: Roll out and health-check production
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)
              inlineScript: |
                set -euo pipefail
                export SHA=$(commit)
                export ACR_LOGIN_SERVER=$(acrLoginServer)
                export ACR_NAME=$(acrName)
                export RESOURCE_GROUP=$(resourceGroup)
                export API_APP=$(apiApp)
                export WEB_APP=$(webApp)
                export PUBLIC_ORIGIN=$(publicOrigin)
                export DEPLOYMENT_ID=$(Build.BuildId)-$(System.JobAttempt)
                chmod +x scripts/deploy-production.sh
                scripts/deploy-production.sh
                API_REV=$(az containerapp revision list -n $API_APP -g $RESOURCE_GROUP --query '[?properties.trafficWeight==100].name | [0]' -o tsv)
                WEB_REV=$(az containerapp revision list -n $WEB_APP -g $RESOURCE_GROUP --query '[?properties.trafficWeight==100].name | [0]' -o tsv)
                API_HEALTH=$(curl --fail --silent --show-error --max-time 30 $PUBLIC_ORIGIN/health/cosmos)
                curl --fail --silent --show-error --max-time 30 $PUBLIC_ORIGIN/ > /dev/null
                echo "Deployed commit: $SHA"
                echo "API image: $ACR_LOGIN_SERVER/$(apiImage):$SHA"
                echo "Web image: $ACR_LOGIN_SERVER/$(webImage):$SHA"
                echo "API revision: $API_REV"
                echo "Web revision: $WEB_REV"
                echo "API health: $API_HEALTH"
                echo "Web health: HTTP 200"
