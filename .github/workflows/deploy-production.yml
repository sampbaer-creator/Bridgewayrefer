
name: Deploy production

# Deploy only when manually triggered from GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

# Only one production deployment at a time.
# Never cancel an active deployment.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      SHA: ${{ github.sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      API_APP: ${{ vars.API_APP }}
      WEB_APP: ${{ vars.WEB_APP }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Verify this is the latest main commit
        shell: bash
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)

          if [ "$latest" != "$SHA" ]; then
            echo "::error::$SHA is no longer the latest commit on main."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API and web images in Azure
        shell: bash
        run: |
          az acr build \
            --registry "$ACR_NAME" \
            --image "bridgeway-api:$SHA" \
            --file src/BridgeWay.Api/Dockerfile .

          az acr build \
            --registry "$ACR_NAME" \
            --image "bridgeway-web:$SHA" \
            --file src/bridgeway-web/Dockerfile .

      - name: Deploy and verify production
        id: rollout
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: |
          bash scripts/deploy-production.sh

      - name: Record deployment result
        if: always()
        shell: bash
        run: |
          echo "Deployment result: ${{ steps.rollout.outcome }}"
          echo "Commit: $SHA"
