name: Deploy production

# Disabled: production deployments are initiated from the local Codex workflow.
# Keep the workflow definition for reference, but do not invoke a deployment job.
on: {}

permissions:
  contents: read

# One production rollout at a time. Never cancel an in-flight rollout.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write   # GitHub OIDC to Azure; no stored Azure secret
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      ACR_NAME: ${{ vars.ACR_NAME }}
      RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
      API_APP: ${{ vars.API_APP }}
      WEB_APP: ${{ vars.WEB_APP }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      - name: Refuse to deploy a superseded commit
        run: |
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SHA" ]; then
            echo "::error::$SHA is no longer the head of main ($latest). Not deploying an older release."
            exit 1
          fi

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build API and web images tagged with the commit SHA
        run: |
          az acr build --registry "$ACR_NAME" --image "bridgeway-api:$SHA" --file src/BridgeWay.Api/Dockerfile .
          az acr build --registry "$ACR_NAME" --image "bridgeway-web:$SHA" --file src/bridgeway-web/Dockerfile .

      - name: Stage candidates, verify, promote, smoke test
        id: rollout
        env:
          ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
        run: bash scripts/deploy-production.sh

      - name: Record outcome
        if: always()
        run: |
          echo "Rollout result: ${{ steps.rollout.outcome }} (commit $SHA)"
