name: Verify C# and React

# Verify pull requests to main without duplicate push runs.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR checks to save GitHub Actions minutes.
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/BridgeWay.Api.Tests --configuration Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/bridgeway-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/bridgeway-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify customer entry and reporting without Azure credentials
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/bridgeway-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000/staff > /dev/null; then break; fi
            sleep 1
          done
          npx playwright test
